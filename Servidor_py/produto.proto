syntax = "proto3";

package loja;

// ==================== SERVIÇO DE PRODUTOS ====================
service ProdutoService {
  rpc GetProduto(ProdutoId) returns (Produto);
  rpc ListarProdutos(Empty) returns (ListaProdutos);
  rpc AtualizarEstoque(AtualizarEstoqueRequest) returns (Produto);
}

// ==================== SERVIÇO DE CLIENTES ====================
service ClienteService {
  rpc RegistrarCliente(Cliente) returns (Cliente);
  rpc GetCliente(ClienteId) returns (Cliente);
  rpc ListarClientes(Empty) returns (ListaClientes);
}

// ==================== SERVIÇO DE PEDIDOS ====================
service PedidoService {
  rpc CriarPedido(Pedido) returns (Pedido);
  rpc GetPedido(PedidoId) returns (Pedido);
  rpc ListarPedidos(ClienteId) returns (ListaPedidos);
  rpc AtualizarStatusPedido(AtualizarStatusRequest) returns (Pedido);
}

// ==================== MENSAGENS - PRODUTO ====================
message Produto {
  int32 id = 1;
  string nome = 2;
  string descricao = 3;
  float preco = 4;
  int32 estoque = 5;
}

message ProdutoId {
  int32 id = 1;
}

message ListaProdutos {
  repeated Produto produtos = 1;
}

message AtualizarEstoqueRequest {
  int32 id = 1;
  int32 quantidade = 2;
}

// ==================== MENSAGENS - CLIENTE ====================
message Cliente {
  int32 id = 1;
  string nome = 2;
  string email = 3;
  string telefone = 4;
  string endereco = 5;
}

message ClienteId {
  int32 id = 1;
}

message ListaClientes {
  repeated Cliente clientes = 1;
}

// ==================== MENSAGENS - PEDIDO ====================
message Pedido {
  int32 id = 1;
  int32 cliente_id = 2;
  repeated int32 produtos_ids = 3;
  float total = 4;
  string status = 5;
}

message PedidoId {
  int32 id = 1;
}

message ListaPedidos {
  repeated Pedido pedidos = 1;
}

message AtualizarStatusRequest {
  int32 id = 1;
  string status = 2;
}

// ==================== MENSAGEM AUXILIAR ====================
message Empty {}